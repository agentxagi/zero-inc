name: Deploy Staging

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy
        required: false
        type: string
        default: master

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zero-inc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail

            COMPOSE_PATH="${STAGING_COMPOSE_PATH:-/opt/zeroinc-staging}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}"

            echo "==> Deploying ${IMAGE}..."

            mkdir -p "$COMPOSE_PATH"
            cd "$COMPOSE_PATH"

            # Write/update .env if missing
            if [ ! -f .env ]; then
              cat > .env <<'ENVEOF'
            DATABASE_URL=postgres://zeroinc:zeroinc@db:5432/zeroinc_staging
            PORT=3100
            SERVE_UI=true
            PAPERCLIP_DEPLOYMENT_MODE=authenticated
            PAPERCLIP_DEPLOYMENT_EXPOSURE=private
            PAPERCLIP_PUBLIC_URL=http://staging.zeroinc.ing:3100
            ENVEOF
            fi

            # Pull the compose file from repo if not present
            if [ ! -f docker-compose.staging.yml ]; then
              echo "ERROR: docker-compose.staging.yml not found on VPS"
              echo "Copy it manually or via scp before deploying."
              exit 1
            fi

            # Save current image for rollback
            CURRENT_IMAGE=$(docker compose -f docker-compose.staging.yml ps --format '{{.Image}}' server 2>/dev/null || echo "")
            echo "$CURRENT_IMAGE" > .previous-image

            # Pull and restart
            export STAGING_IMAGE="$IMAGE"
            docker compose -f docker-compose.staging.yml pull server || true
            docker compose -f docker-compose.staging.yml up -d server

            # Wait for healthy
            echo "==> Waiting for server to start..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3100/api/health > /dev/null 2>&1; then
                echo "==> Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: Health check failed after 60s"
            echo "==> Rolling back to ${CURRENT_IMAGE:-none}"
            if [ -n "$CURRENT_IMAGE" ]; then
              export STAGING_IMAGE="$CURRENT_IMAGE"
              docker compose -f docker-compose.staging.yml up -d server
            fi
            exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for ${{ github.sha }}"
