name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA, branch, or tag to publish as stable
        required: true
        type: string
        default: master
      stable_date:
        description: Enter a UTC date in YYYY-MM-DD format
        required: false
        type: string
      dry_run:
        description: Preview the stable release without publishing
        required: true
        type: boolean
        default: false
      release_type:
        description: Release type
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore tracked install-time changes
        run: git checkout -- pnpm-lock.yaml

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish
        env:
          GITHUB_ACTIONS: "true"
        run: |
          args=(${{ inputs.release_type }} --skip-verify)
          if [ "${{ inputs.release_type }}" = "stable" ] && [ -n "${{ inputs.stable_date }}" ]; then
            args+=(--date "${{ inputs.stable_date }}")
          fi
          if [ "${{ inputs.release_type }}" = "stable" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            : # proceed normally
          elif [ "${{ inputs.release_type }}" = "stable" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/release.sh "${args[@]}"

      - name: Push tag
        if: inputs.dry_run == 'false'
        run: |
          tag_prefix="v"
          if [ "${{ inputs.release_type }}" = "canary" ]; then
            tag_prefix="canary/v"
          fi
          tag="$(git tag --points-at HEAD | grep "^${tag_prefix}" | head -1)"
          if [ -z "$tag" ]; then
            echo "Error: no matching tag points at HEAD." >&2
            exit 1
          fi
          git push origin "refs/tags/${tag}"
