services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zeroinc
      POSTGRES_PASSWORD: zeroinc
      POSTGRES_DB: zeroinc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroinc -d zeroinc"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://zeroinc:zeroinc@db:5432/zeroinc
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - zeroinc-data:/zeroinc
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  zeroinc-data:
